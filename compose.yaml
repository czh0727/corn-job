services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cornjob
      MYSQL_USER: cornjob
      MYSQL_PASSWORD: cornjob
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
